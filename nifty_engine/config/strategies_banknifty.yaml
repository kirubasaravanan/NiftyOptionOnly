# Strategy enablement & thresholds — BANKNIFTY
# Added 2026-08-18 as a LITERAL COPY of strategies.yaml's NIFTY values — an
# unvalidated starting point, not a tuned threshold. See risk_banknifty.yaml
# for the same caveat.

strategies:
  long_call:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.2
  long_put:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.2
  long_straddle:
    enabled: false
    min_expected_net_value: 800
    min_confidence_score: 0.60
  long_strangle:
    enabled: false
  debit_spread:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.5
    # Corrected 2026-08-18: was a verbatim copy of NIFTY's 50/200 (NIFTY-point
    # scale), which is dimensionally wrong here — BANKNIFTY trades at ~2.4x
    # NIFTY's spot level (57k vs 24k) and its strikes step in 100s, not 50s,
    # so 50 was below the minimum achievable spread width on this instrument's
    # own strike grid. Scaled by the same ~2.4x spot ratio and rounded to
    # BANKNIFTY's 100-point strike step. Still an unvalidated starting point,
    # not a tuned threshold — same caveat as everything else in this file.
    min_spread_width: 100
    max_spread_width: 500
    preferred_when_vix_expensive: true
  iron_condor:
    enabled: false
  butterfly:
    enabled: false
  no_trade:
    enabled: true

switching:
  min_hold_minutes: 15
  cooldown_after_exit_minutes: 10
  max_switches_per_day: 4
