# Transaction cost model — NSE NIFTY options
# All rates current as of FY25-26. Update if regulator revises.
# Every backtest & live trade MUST apply these — never report gross P&L as profit.

brokerage:
  # Per order flat — Dhan charges ₹20 per executed order for options
  per_order: 20
  cap_per_order: 20              # INR cap

stt:
  # Securities Transaction Tax — options: charged on both buy AND sell side
  # Buy side: 0.0625% of premium; Sell side (exercised/assigned): 0.125% of strike
  options_buy_pct_of_premium: 0.000625
  options_sell_pct_of_premium: 0.000625     # on premium for normal sell
  options_sell_exercised_pct_of_strike: 0.00125

exchange_transaction_charges:
  # NSE derivatives — options: 0.0448% of premium (sell side, rounded)
  options_pct_of_premium: 0.000448

gst:
  # 18% on (brokerage + SEBI + exchange charges)
  rate: 0.18

sebi_charges:
  # ₹10 per crore of turnover
  per_crore: 10

stamp_duty:
  # Buyer side only — options: 0.003% of premium
  options_buy_pct_of_premium: 0.00003

slippage:
  # Calibrated 2026-08-19 against REAL measured bid-ask spreads on live
  # ATM-window quotes (+/-3 strikes, the window the strategies actually pick
  # from) across all three instruments. Replaces the previous fixed-points
  # model (1.0pt slippage + 1.0pt spread per leg).
  #
  # WHY PERCENTAGE, NOT POINTS — the measurement that forced this:
  #   instrument   median spread (pts)   median spread (% of premium)
  #   NIFTY               0.25                    0.24%
  #   SENSEX              0.45                    0.25%
  #   BANKNIFTY           0.90                    0.29%
  # Spreads vary 3.6x in POINTS across instruments but are nearly identical
  # as a PERCENTAGE of premium. Percentage is the invariant, so a fixed-points
  # model is dimensionally wrong — it was overstating NIFTY's spread cost by
  # ~8x while understating it relative to BANKNIFTY's. (Same bug class as the
  # debit_spread min/max_spread_width copy fixed 2026-08-18: a NIFTY-point
  # constant applied to instruments at different price levels.) Percentage
  # also makes this config correctly instrument-agnostic — one global file.
  #
  # VALUES ARE DELIBERATELY CONSERVATIVE, not fitted to produce trades:
  # crossing from mid costs ~half the spread per leg (~0.125% observed), so
  # 0.20%/leg for spread already assumes you pay the FULL observed spread on
  # every leg. Plus 0.15%/leg slippage for adverse fills/market impact.
  # Total 0.35%/leg = 0.70% round trip, ~2.8x the observed pure spread cost,
  # covering spread widening in fast markets. Verified after changing: this
  # still does NOT make any current candidate eligible — the binding
  # constraint remains theta vs. expected move, not costs.
  bid_ask_pct_of_premium: 0.0020      # per leg, as fraction of premium
  slippage_pct_of_premium: 0.0015     # per leg, additional adverse-fill cost
  # Floor in absolute points per leg — a pure percentage understates cost on
  # very cheap options, where the 0.05 tick size dominates.
  min_points_per_leg: 0.05
