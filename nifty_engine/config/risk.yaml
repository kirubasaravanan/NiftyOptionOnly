# Risk engine configuration
# All thresholds configurable — NEVER hard-coded in strategy code.
# Adjust only after walk-forward validation (Phase 7).

capital:
  default: 1000000           # INR
  configurable_scaling_ladder: [200000, 500000, 1000000, 1500000, 2000000]

per_trade:
  max_risk_pct: 1.5           # max % of capital risked per trade
  max_premium_pct: 3.0        # max % of capital in premium (long options)
  # Stop-loss as a fraction of entry premium (added 2026-08-19). MUST stay in
  # sync with the strategies' RISK_USING_STOP_FRACTION (long_call.py /
  # long_put.py) — they size `risk` off this same fraction, and if the two
  # diverge the risk_reward gate stops meaning anything. Previously the engine
  # placed a 1-ATR-move stop (~6% of premium) while the strategies priced a
  # 50% loss, a 4-8x mismatch measured live.
  stop_loss_pct_of_premium: 0.50

daily:
  max_loss_pct: 3.0           # hard daily loss limit (hit -> emergency stop)
  max_trades: 6               # cap to prevent over-trading
  max_consecutive_losses: 3   # triggers cooldown

portfolio:
  max_open_positions: 2
  max_exposure_pct: 6.0       # total premium exposure cap

cooldown:
  after_consecutive_losses: 3
  duration_minutes: 60

emergency_shutdown:
  stale_data_seconds: 30
  abnormal_spread_ticks: 20   # in NIFTY points
  api_failure_retries: 3

# The system NEVER allows martingale / averaging into losers
no_martingale: true
no_averaging_losers: true
