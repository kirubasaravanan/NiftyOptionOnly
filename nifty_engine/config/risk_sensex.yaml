# Risk engine configuration — SENSEX
# Added 2026-08-18 as a LITERAL COPY of risk.yaml's NIFTY values — an
# unvalidated starting point, not a tuned threshold. Per ROADMAP.md's own
# rule: per-instrument parameters must be independently validated, never
# inherited from NIFTY's tuning just because the architecture is shared.

capital:
  default: 750000
  configurable_scaling_ladder: [200000, 500000, 1000000, 1500000, 2000000]

per_trade:
  max_risk_pct: 1.5
  max_premium_pct: 3.0
  # Fallback only — superseded by intraday.* below. See risk.yaml.
  stop_loss_pct_of_premium: 0.50

# Intraday day-trading parameters (2026-08-19) — read by BOTH the strategies
# and the risk engine so the two cannot drift apart. See risk.yaml for the
# full rationale. All three values are UNVALIDATED starting points.
intraday:
  horizon_bars: 24
  expected_move_capture: 0.60
  stop_fraction_of_expected_move: 0.50

daily:
  max_loss_pct: 3.0
  max_trades: 6
  max_consecutive_losses: 3

portfolio:
  max_open_positions: 2
  max_exposure_pct: 6.0

cooldown:
  after_consecutive_losses: 3
  duration_minutes: 60

emergency_shutdown:
  stale_data_seconds: 30
  abnormal_spread_ticks: 20
  api_failure_retries: 3

no_martingale: true
no_averaging_losers: true
