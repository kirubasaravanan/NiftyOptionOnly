# Strategy enablement & thresholds — SENSEX
# Added 2026-08-18 as a LITERAL COPY of strategies.yaml's NIFTY values — an
# unvalidated starting point, not a tuned threshold. See risk_sensex.yaml
# for the same caveat.

strategies:
  long_call:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.2
  long_put:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.2
  long_straddle:
    enabled: false
    min_expected_net_value: 800
    min_confidence_score: 0.60
  long_strangle:
    enabled: false
  debit_spread:
    enabled: true
    min_expected_net_value: 500
    min_confidence_score: 0.55
    min_risk_reward: 1.5
    min_spread_width: 50
    max_spread_width: 200
    preferred_when_vix_expensive: true
  iron_condor:
    enabled: false
  butterfly:
    enabled: false
  no_trade:
    enabled: true

switching:
  min_hold_minutes: 15
  cooldown_after_exit_minutes: 10
  max_switches_per_day: 4
